{{- /* Custom head additions */ -}}
<style>
.home-banner {
    margin: 0 0 var(--gap) 0;
}
.home-banner img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 380px;
    object-fit: cover;
    object-position: center;
    border-radius: var(--radius);
}

.home-social {
    margin: 0 0 var(--gap) 0;
}
.home-social .social-icons {
    padding: 0;
}
.home-social .social-icons a:first-of-type {
    padding-inline-start: 0;
}

/* ---------------------------------------------------------------- */
/* Listing styles (params.listStyle) live in assets/css/extended/   */
/* list-thumb.css — keep them there, not here, so the bundled       */
/* stylesheet stays the single source of truth.                     */
/* ---------------------------------------------------------------- */

/* ---------------------------------------------------------------- */
/* "On this day" — same calendar day in other years, below each post */
/* ---------------------------------------------------------------- */
.on-this-day {
    margin-top: calc(var(--gap) * 2);
    padding-top: var(--gap);
    border-top: 1px solid var(--border);
}
.on-this-day h3 {
    margin: 0 0 calc(var(--gap) / 2) 0;
    font-size: 1rem;
    color: var(--secondary);
}
.on-this-day ul {
    margin: 0;
    padding: 0;
    list-style: none;
}
.on-this-day li {
    display: flex;
    gap: 0.6em;
    padding: 0.2em 0;
    line-height: 1.5;
}
.on-this-day time {
    flex: 0 0 3.2em;
    color: var(--secondary);
    font-variant-numeric: tabular-nums;
}
.on-this-day a {
    color: var(--content);
    box-shadow: 0 1px 0 0 var(--primary);
}
.on-this-day a:hover {
    box-shadow: none;
}
</style>
